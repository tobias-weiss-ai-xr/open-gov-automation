# Beispiel-CI-Pipeline für Fördermittel-Verwaltung
# Anwendung der Unix-Prinzipien: Modular, Testbar, Transparent

name: Fördermittel Verwaltung CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: foerdermittel-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PG_PORT: 15433
  DGRAPH_PORT: 18081

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: LINT — Code-Qualität (schnell, keine Infra)
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Security audit
        run: npm audit --audit-level=critical

  # ──────────────────────────────────────────────
  # JOB 2: TEST — Anwendungsfälle (mit DB)
  # ──────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    needs: lint

    env:
      PG_HOST: localhost
      PG_DATABASE: foerdermittel_test
      PG_USER: test
      PG_PASSWORD: test
      PG_PORT: ${{ env.PG_PORT }}
      DGRAPH_URL: http://localhost:${{ env.DGRAPH_PORT }}

    steps:
      - uses: actions/checkout@v7

      - name: Start Test Infrastructure
        run: |
          # Sauber starten — Unix-Prinzip: Keine Seiteneffekte
          docker rm -f test-pg test-dg 2>/dev/null || true

          docker run -d --name test-pg \
            -p ${{ env.PG_PORT }}:5432 \
            -e POSTGRES_DB=${{ env.PG_DATABASE }} \
            -e POSTGRES_USER=${{ env.PG_USER }} \
            -e POSTGRES_PASSWORD=${{ env.PG_PASSWORD }} \
            postgres:17-alpine

          docker run -d --name test-dg \
            -p ${{ env.DGRAPH_PORT }}:8080 \
            dgraph/standalone:v24.0.0

          # Wait for services
          for i in $(seq 1 30); do
            docker exec test-pg pg_isready -U test && break
            sleep 1
          done

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate applications
        run: npm run validate:applications

      - name: Check deadlines
        run: npm run check:deadlines

      - name: Cleanup
        if: always()
        run: docker rm -f test-pg test-dg 2>/dev/null || true

  # ──────────────────────────────────────────────
  # JOB 3: E2E — Realistische Szenarien
  # ──────────────────────────────────────────────
  e2e:
    name: End-to-End Tests
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    needs: test

    env:
      PG_PORT: 25433
      DGRAPH_PORT: 28081

    steps:
      - uses: actions/checkout@v7

      - name: Start E2E Infrastructure
        run: |
          docker rm -f e2e-pg e2e-dg 2>/dev/null || true

          docker run -d --name e2e-pg \
            -p ${{ env.PG_PORT }}:5432 \
            -e POSTGRES_DB=foerdermittel_e2e \
            -e POSTGRES_USER=e2e \
            -e POSTGRES_PASSWORD=e2e \
            postgres:17-alpine

          docker run -d --name e2e-dg \
            -p ${{ env.DGRAPH_PORT }}:8080 \
            dgraph/standalone:v24.0.0

          sleep 10  # Wait for services

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install

      - name: Run E2E scenarios
        run: npm run test:e2e

      - name: Cleanup
        if: always()
        run: docker rm -f e2e-pg e2e-dg 2>/dev/null || true

  # ──────────────────────────────────────────────
  # JOB 4: DEPLOY — Nur wenn alles grün
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: |
          docker build \
            --target production \
            --tag foerdermittel:latest \
            .

      - name: Deploy
        run: |
          docker compose -f docker-compose.admin.yml up -d

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3003/api/health/ready && exit 0
            sleep 1
          done
          exit 1
