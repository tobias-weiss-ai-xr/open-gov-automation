<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     width="1200" height="600" 
     viewBox="0 0 1200 600"
     fill="none">

  <!-- Background: Pure white -->
  <rect width="1200" height="600" fill="#ffffff"/>

  <!-- Geometric foundation grid (subtle) -->
  <g stroke="#f3f4f6" stroke-width="1" opacity="0.3">
    <line x1="100" y1="100" x2="1100" y2="100"/>
    <line x1="100" y1="500" x2="1100" y2="500"/>
    <line x1="100" y1="100" x2="100" y2="500"/>
    <line x1="1100" y1="100" x2="1100" y2="500"/>
    <line x1="600" y1="100" x2="600" y2="500"/>
    <line x1="100" y1="300" x2="1100" y2="300"/>
  </g>

  <!-- ======================================== -->
  <!-- LEFT: Local Infrastructure (Sovereignty) -->
  <!-- ======================================== -->
  <g transform="translate(200, 200)">
    
    <!-- Server 1 (Primary) - Clean, solid rectangle -->
    <rect x="0" y="0" width="160" height="100" 
          fill="#111827" rx="0" stroke="none"/>
    <rect x="20" y="20" width="120" height="60" 
          fill="none" stroke="#2563eb" stroke-width="1"/>
    
    <!-- Server 2 (Replica) -->
    <rect x="200" y="0" width="160" height="100" 
          fill="#111827" rx="0" stroke="none"/>
    <rect x="220" y="20" width="120" height="60" 
          fill="none" stroke="#2563eb" stroke-width="1"/>
    
    <!-- Connection line (SSL) -->
    <line x1="160" y1="50" x2="200" y2="50" 
          stroke="#2563eb" stroke-width="3"/>
    
    <!-- Label -->
    <text x="100" y="-50" text-anchor="middle" 
          font-family="Inter, -apple-system, sans-serif" 
          font-size="18" font-weight="600" fill="#111827">Lokale Infrastruktur</text>
    <text x="100" y="-35" text-anchor="middle" 
          font-family="Inter, -apple-system, sans-serif" 
          font-size="14" font-weight="400" fill="#6b7280">2× ASUS GX10, gekoppelt</text>
    
    <!-- Data blocks (subtle) -->
    <rect x="40" y="30" width="8" height="8" fill="#10b981" opacity="0.8"/>
    <rect x="52" y="30" width="8" height="8" fill="#10b981" opacity="0.8"/>
    <rect x="64" y="30" width="8" height="8" fill="#10b981" opacity="0.8"/>
    <rect x="76" y="30" width="8" height="8" fill="#10b981" opacity="0.8"/>
    <rect x="240" y="30" width="8" height="8" fill="#10b981" opacity="0.8"/>
    <rect x="252" y="30" width="8" height="8" fill="#10b981" opacity="0.8"/>
    <rect x="264" y="30" width="8" height="8" fill="#10b981" opacity="0.8"/>
    <rect x="276" y="30" width="8" height="8" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- ======================================== -->
  <!-- RIGHT: Citizen Interface (Transparency) -->
  <!-- ======================================== -->
  <g transform="translate(800, 200)">
    
    <!-- Citizen device (minimal laptop) -->
    <rect x="0" y="30" width="120" height="70" 
          fill="#f9fafb" rx="0" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="100" y="35" width="8" height="60" 
          fill="#e5e7eb" rx="0"/>
    <rect x="8" y="45" width="104" height="40" 
          fill="#111827" rx="0"/>
    
    <!-- Building plan icon on screen (minimal) -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="16" height="12" fill="#2563eb"/>
      <polygon points="0,0 8,6 16,0" fill="#111827"/>
      <line x1="8" y1="6" x2="8" y2="12" stroke="#111827" stroke-width="1"/>
    </g>
    
    <!-- Checkmark (approval) -->
    <g transform="translate(60, 60)">
      <circle cx="6" cy="6" r="5" fill="#10b981"/>
      <path d="M4 9 L6 11 L8 7" stroke="#ffffff" stroke-width="1.5" 
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Label -->
    <text x="60" y="-50" text-anchor="middle" 
          font-family="Inter, -apple-system, sans-serif" 
          font-size="18" font-weight="600" fill="#111827">Bürger &amp; Verwaltung</text>
    <text x="60" y="-35" text-anchor="middle" 
          font-family="Inter, -apple-system, sans-serif" 
          font-size="14" font-weight="400" fill="#6b7280">Transparente Entscheidungen</text>
  </g>

  <!-- ======================================== -->
  <!-- CENTER: AI Core (Intelligence) -->
  <!-- ======================================== -->
  <g transform="translate(600, 150)">
    
    <!-- Outer circle (boundary) -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    
    <!-- Inner hexagon (AI processing core) -->
    <polygon points="-50,-29 -50,29 0,58 50,29 50,-29 0,-58" 
             fill="none" stroke="#2563eb" stroke-width="2"/>
    
    <!-- Center dot (processing) -->
    <circle cx="0" cy="0" r="8" fill="#2563eb"/>
    
    <!-- Neural connections (subtle) -->
    <line x1="-40" y1="-20" x2="40" y2="20" 
          stroke="#2563eb" stroke-width="0.5" opacity="0.6"/>
    <line x1="-40" y1="20" x2="40" y2="-20" 
          stroke="#2563eb" stroke-width="0.5" opacity="0.6"/>
    <line x1="-30" y1="-30" x2="30" y2="30" 
          stroke="#2563eb" stroke-width="0.5" opacity="0.6"/>
    <line x1="-30" y1="30" x2="30" y2="-30" 
          stroke="#2563eb" stroke-width="0.5" opacity="0.6"/>
    
    <!-- Label -->
    <text x="0" y="-120" text-anchor="middle" 
          font-family="Inter, -apple-system, sans-serif" 
          font-size="20" font-weight="700" fill="#111827">KI-Einheit</text>
    <text x="0" y="-105" text-anchor="middle" 
          font-family="Inter, -apple-system, sans-serif" 
          font-size="14" font-weight="400" fill="#6b7280">Lokal &amp; souverän</text>
  </g>

  <!-- ======================================== -->
  <!-- Connection Lines (Data Flow) -->
  <!-- ======================================== -->
  <g stroke="#6b7280" stroke-width="1">
    <!-- From servers to AI -->
    <line x1="360" y1="250" x2="480" y2="230"/>
    <line x1="360" y1="250" x2="480" y2="270"/>
    
    <!-- From AI to citizen -->
    <line x1="720" y1="230" x2="840" y2="250"/>
    <line x1="720" y1="270" x2="840" y2="250"/>
  </g>

  <!-- Data flow indicators -->
  <g>
    <circle cx="420" cy="240" r="2" fill="#10b981"/>
    <circle cx="450" cy="245" r="2" fill="#10b981"/>
    <circle cx="780" cy="240" r="2" fill="#2563eb"/>
    <circle cx="810" cy="245" r="2" fill="#2563eb"/>
  </g>

  <!-- ======================================== -->
  <!-- Title &amp; Tagline -->
  <!-- ======================================== -->
  <text x="600" y="50" text-anchor="middle" 
        font-family="Inter, -apple-system, sans-serif" 
        font-size="28" font-weight="700" fill="#111827">
    open-gov-automation
  </text>
  
  <text x="600" y="80" text-anchor="middle" 
        font-family="Inter, -apple-system, sans-serif" 
        font-size="16" font-weight="400" fill="#6b7280">
    Souveräne KI für die öffentliche Verwaltung
  </text>

  <!-- ======================================== -->
  <!-- Philosophy Principles (Bottom) -->
  <!-- ======================================== -->
  <g transform="translate(500, 500)" 
     font-family="Inter, -apple-system, sans-serif" 
     font-size="13" fill="#6b7280">
    <text x="-120" y="0">Lokal</text>
    <text x="0" y="0">Souverän</text>
    <text x="120" y="0">DSGVO-konform</text>
    <text x="-120" y="20">Transparent</text>
    <text x="0" y="20">Open Source</text>
    <text x="120" y="20">Unabhängig</text>
  </g>

  <!-- ======================================== -->
  <!-- Minimal Logo (Top-Left) -->
  <!-- ======================================== -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="24" height="24" fill="#2563eb"/>
    <polygon points="0,0 12,12 24,0" fill="#ffffff"/>
    <text x="32" y="18" 
          font-family="Inter, -apple-system, sans-serif" 
          font-size="14" font-weight="600" fill="#111827">graphwiz</text>
  </g>

</svg>
