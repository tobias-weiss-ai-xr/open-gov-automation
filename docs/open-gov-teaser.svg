<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     width="800" height="400" 
     viewBox="0 0 800 400"
     fill="none">

  <!-- Background: Clean white -->
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Geometric framework - subtle grid lines -->
  <g stroke="#e0e0e0" stroke-width="1" opacity="0.5">
    <line x1="100" y1="50" x2="700" y2="50"/>
    <line x1="100" y1="350" x2="700" y2="350"/>
    <line x1="100" y1="50" x2="100" y2="350"/>
    <line x1="700" y1="50" x2="700" y2="350"/>
  </g>

  <!-- Left side - Local infrastructure (2 servers) -->
  <g transform="translate(200, 100)">
    <!-- Server 1 (Primary) -->
    <rect x="0" y="0" width="120" height="80" 
          fill="#1a365d" rx="4" stroke="#2563eb" stroke-width="2"/>
    <rect x="10" y="10" width="100" height="60" 
          fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Server CPU/GPU indication -->
    <rect x="20" y="20" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="40" y="20" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="60" y="20" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="80" y="20" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="20" y="40" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="40" y="40" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="60" y="40" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="80" y="40" width="15" height="15" fill="#10b981" opacity="0.8"/>
    
    <!-- Server label -->
    <text x="60" y="-8" text-anchor="middle" 
          font-family="Inter, -apple-system, sans-serif" 
          font-size="14" font-weight="600" fill="#0f172a">Server A</text>
    
    <!-- Server 2 (Replica) -->
    <rect x="140" y="0" width="120" height="80" 
          fill="#1a365d" rx="4" stroke="#2563eb" stroke-width="2"/>
    <rect x="150" y="10" width="100" height="60" 
          fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Server CPU/GPU indication -->
    <rect x="160" y="20" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="180" y="20" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="200" y="20" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="220" y="20" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="160" y="40" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="180" y="40" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="200" y="40" width="15" height="15" fill="#10b981" opacity="0.8"/>
    <rect x="220" y="40" width="15" height="15" fill="#10b981" opacity="0.8"/>
    
    <!-- Server label -->
    <text x="190" y="-8" text-anchor="middle" 
          font-family="Inter, -apple-system, sans-serif" 
          font-size="14" font-weight="600" fill="#0f172a">Server B</text>
    
    <!-- Connection between servers (mesh) -->
    <line x1="120" y1="40" x2="140" y2="40" 
          stroke="#2563eb" stroke-width="4" stroke-dasharray="8,4"/>
    <line x1="120" y1="40" x2="140" y2="40" 
          stroke="#3b82f6" stroke-width="2"/>
  </g>

  <!-- Right side - Citizen/Administration interface -->
  <g transform="translate(500, 100)">
    <!-- Citizen device (laptop/tablet) -->
    <rect x="0" y="20" width="100" height="60" 
          fill="#f3f4f6" rx="8" stroke="#d1d5db" stroke-width="2"/>
    <rect x="85" y="25" width="5" height="50" 
          fill="#d1d5db" rx="2"/>
    <rect x="5" y="35" width="80" height="30" 
          fill="#374151" rx="2"/>
    
    <!-- Building plan icon on screen -->
    <g transform="translate(15, 42)">
      <rect x="0" y="0" width="20" height="15" fill="#3b82f6" opacity="0.8"/>
      <polygon points="0,0 10,8 20,0" fill="#2563eb" opacity="0.8"/>
      <line x1="10" y1="8" x2="10" y2="15" stroke="#2563eb" stroke-width="1"/>
    </g>
    
    <!-- Checkmark (approval) -->
    <g transform="translate(50, 45)">
      <circle cx="8" cy="8" r="6" fill="#10b981" opacity="0.8"/>
      <path d="M5 11 L8 14 L11 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Label -->
    <text x="50" y="85" text-anchor="middle" 
          font-family="Inter, -apple-system, sans-serif" 
          font-size="12" font-weight="500" fill="#374151">Bürger / Verwaltung</text>
  </g>

  <!-- Central AI Brain -->
  <g transform="translate(350, 50)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#d1d5db" stroke-width="1"/>
    
    <!-- Inner hexagon (AI core) -->
    <polygon points="-40,-23 -40,23 0,46 40,23 40,-23 0,-46" 
             fill="none" stroke="#2563eb" stroke-width="2"/>
    
    <!-- Inner circle (processing) -->
    <circle cx="0" cy="0" r="30" fill="#3b82f6" opacity="0.1"/>
    
    <!-- Neural network lines -->
    <line x1="-30" y1="-15" x2="30" y2="15" stroke="#2563eb" stroke-width="1" opacity="0.6"/>
    <line x1="-30" y1="15" x2="30" y2="-15" stroke="#2563eb" stroke-width="1" opacity="0.6"/>
    <line x1="-25" y1="-25" x2="25" y2="25" stroke="#2563eb" stroke-width="1" opacity="0.6"/>
    <line x1="-25" y1="25" x2="25" y2="-25" stroke="#2563eb" stroke-width="1" opacity="0.6"/>
    
    <!-- Label -->
    <text x="0" y="-90" text-anchor="middle" 
          font-family="Inter, -apple-system, sans-serif" 
          font-size="16" font-weight="600" fill="#0f172a">KI-Einheit</text>
    <text x="0" y="-75" text-anchor="middle" 
          font-family="Inter, -apple-system, sans-serif" 
          font-size="12" font-weight="400" fill="#6b7280">(Lokal & souverän)</text>
  </g>

  <!-- Connection lines -->
  <g stroke="#6b7280" stroke-width="2">
    <!-- From servers to AI -->
    <line x1="260" y1="130" x2="310" y2="110"/>
    <line x1="340" y1="130" x2="390" y2="110"/>
    
    <!-- From AI to citizen -->
    <line x1="410" y1="130" x2="460" y2="110"/>
    <line x1="410" y1="150" x2="460" y2="130"/>
  </g>

  <!-- Data flow indicators -->
  <g>
    <circle cx="285" cy="120" r="3" fill="#10b981"/>
    <circle cx="320" cy="125" r="3" fill="#10b981"/>
    <circle cx="435" cy="120" r="3" fill="#3b82f6"/>
    <circle cx="475" cy="125" r="3" fill="#3b82f6"/>
  </g>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" 
        font-family="Inter, -apple-system, sans-serif" 
        font-size="20" font-weight="700" fill="#0f172a">
    open-gov-automation
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="380" text-anchor="middle" 
        font-family="Inter, -apple-system, sans-serif" 
        font-size="14" font-weight="400" fill="#6b7280">
    Souveräne KI für die öffentliche Verwaltung
  </text>

  <!-- Key principles in bottom right -->
  <g transform="translate(650, 350)" 
     font-family="Inter, -apple-system, sans-serif" 
     font-size="11" fill="#6b7280">
    <text x="0" y="-15">Lokal</text>
    <text x="0" y="0">Souverän</text>
    <text x="0" y="15">DSGVO-konform</text>
    <text x="0" y="30">Open Source</text>
  </g>

</svg>
