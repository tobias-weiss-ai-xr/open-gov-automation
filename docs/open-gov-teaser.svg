<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="742"
     viewBox="0 0 1200 742"
     fill="none">

  <!-- Background -->
  <rect width="1200" height="742" fill="#ffffff"/>

  <!-- Subtle golden-section frame (0.382 / 0.618 of W = 458 / 742) -->
  <g stroke="#f3f4f6" stroke-width="1">
    <line x1="458" y1="40" x2="458" y2="702"/>
    <line x1="742" y1="40" x2="742" y2="702"/>
  </g>

  <!-- ============ TITLE ============ -->
  <text x="600" y="96" text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="34" font-weight="700" fill="#111827">open-gov-automation</text>
  <text x="600" y="128" text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="17" font-weight="400" fill="#6b7280">Souveräne KI für die öffentliche Verwaltung</text>

  <!-- Minimal logo (top-left) -->
  <g transform="translate(90, 82)">
    <rect x="0" y="0" width="28" height="28" fill="#2563eb"/>
    <polygon points="0,0 14,14 28,0" fill="#ffffff"/>
    <text x="40" y="20" font-family="Inter, -apple-system, sans-serif"
          font-size="16" font-weight="600" fill="#111827">graphwiz</text>
  </g>

  <!-- ============================================== -->
  <!-- LEFT: Lokale Infrastruktur (2× GX10 gekoppelt) -->
  <!-- ============================================== -->
  <!-- Server 1 -->
  <rect x="205" y="373" width="180" height="115" fill="#111827"/>
  <rect x="225" y="393" width="140" height="75" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <g fill="#10b981">
    <rect x="245" y="403" width="10" height="10"/>
    <rect x="265" y="403" width="10" height="10"/>
    <rect x="285" y="403" width="10" height="10"/>
    <rect x="305" y="403" width="10" height="10"/>
  </g>
  <!-- Server 2 -->
  <rect x="415" y="373" width="180" height="115" fill="#111827"/>
  <rect x="435" y="393" width="140" height="75" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <g fill="#10b981">
    <rect x="455" y="403" width="10" height="10"/>
    <rect x="475" y="403" width="10" height="10"/>
    <rect x="495" y="403" width="10" height="10"/>
    <rect x="515" y="403" width="10" height="10"/>
  </g>
  <!-- Coupling link -->
  <line x1="385" y1="430" x2="415" y2="430" stroke="#2563eb" stroke-width="4"/>
  <text x="400" y="418" text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="11" font-weight="600" fill="#6b7280">400 Gbps</text>
  <!-- Labels -->
  <text x="400" y="355" text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="20" font-weight="600" fill="#111827">Lokale Infrastruktur</text>
  <text x="400" y="337" text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="14" font-weight="400" fill="#6b7280">2× ASUS GX10, gekoppelt</text>

  <!-- ============================================== -->
  <!-- CENTER: KI-Einheit (focal, largest, golden pt) -->
  <!-- ============================================== -->
  <circle cx="742" cy="430" r="110" fill="none" stroke="#e5e7eb" stroke-width="1"/>
  <polygon points="742,360 802,395 802,465 742,500 682,465 682,395"
           fill="none" stroke="#2563eb" stroke-width="3"/>
  <g stroke="#2563eb" stroke-width="0.75" opacity="0.55">
    <line x1="702" y1="395" x2="782" y2="465"/>
    <line x1="702" y1="465" x2="782" y2="395"/>
    <line x1="712" y1="380" x2="772" y2="480"/>
    <line x1="712" y1="480" x2="772" y2="380"/>
  </g>
  <circle cx="742" cy="430" r="14" fill="#2563eb"/>
  <!-- Labels -->
  <text x="742" y="302" text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="22" font-weight="700" fill="#111827">KI-Einheit</text>
  <text x="742" y="284" text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="14" font-weight="400" fill="#6b7280">Lokal &amp; souverän</text>

  <!-- ============================================== -->
  <!-- RIGHT: Verwaltung (nutzt die KI vor Ort)       -->
  <!-- ============================================== -->
  <rect x="880" y="365" width="200" height="130" rx="2" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="892" y="377" width="176" height="96" fill="#111827"/>
  <!-- building glyph on screen -->
  <g transform="translate(912, 402)">
    <rect x="0" y="0" width="20" height="16" fill="#2563eb"/>
    <polygon points="0,0 10,8 20,0" fill="#2563eb"/>
    <rect x="8" y="8" width="4" height="8" fill="#0b1220"/>
  </g>
  <!-- approval check on screen -->
  <g transform="translate(1010, 410)">
    <circle cx="8" cy="8" r="9" fill="#10b981"/>
    <path d="M4 11 L8 15 L13 6" stroke="#ffffff" stroke-width="2" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- stand -->
  <rect x="970" y="495" width="20" height="12" fill="#e5e7eb"/>
  <rect x="955" y="507" width="50" height="8" fill="#e5e7eb"/>
  <!-- Labels -->
  <text x="980" y="347" text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="20" font-weight="600" fill="#111827">Verwaltung</text>
  <text x="980" y="329" text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="14" font-weight="400" fill="#6b7280">Nutzt die KI vor Ort</text>

  <!-- ============================================== -->
  <!-- Connection lines (data flow)                   -->
  <!-- ============================================== -->
  <g stroke="#6b7280" stroke-width="1.5">
    <line x1="595" y1="415" x2="632" y2="415"/>
    <line x1="595" y1="445" x2="632" y2="445"/>
    <line x1="852" y1="415" x2="880" y2="415"/>
    <line x1="852" y1="445" x2="880" y2="445"/>
  </g>
  <g>
    <circle cx="610" cy="415" r="2.5" fill="#10b981"/>
    <circle cx="622" cy="445" r="2.5" fill="#10b981"/>
    <circle cx="865" cy="415" r="2.5" fill="#2563eb"/>
    <circle cx="872" cy="445" r="2.5" fill="#2563eb"/>
  </g>

  <!-- ============================================== -->
  <!-- Philosophy principles (bottom, 2×3)            -->
  <!-- ============================================== -->
  <g font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">
    <text x="400" y="640">Lokal</text>
    <text x="600" y="640">Souverän</text>
    <text x="800" y="640">DSGVO-konform</text>
    <text x="400" y="662">Transparent</text>
    <text x="600" y="662">Open Source</text>
    <text x="800" y="662">Unabhängig</text>
  </g>

</svg>
